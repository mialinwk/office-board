<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>TATE 公司電子布告欄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
    body {
        margin: 0; padding: 0;
        width: 100vw; height: 100vh;
        background: url('background.png') no-repeat center center;
        background-size: 100% 100%; /* 強制背景與視窗完全同步縮放 */
        overflow: hidden;
        position: relative;
    }

    /* L1 公告區 */
    #L1_Container {
        position: absolute;
        top: 35.5%; left: 2.2%; width: 42%; height: 54%;
        font-size: 2vw; /* 字體隨寬度縮放 */
        padding: 1%;
        box-sizing: border-box;
    }

    /* R2 時間區 */
    #R2_Time {
        position: absolute;
        top: 34.5%; left: 47.5%; width: 25.5%;
        text-align: center;
    }
    .date-str { font-size: 1.8vw; font-weight: bold; }
    .time-str { font-size: 3.5vw; font-weight: 900; color: #0056b3; }

    /* R3 天氣區 */
    #R3_Weather {
        position: absolute;
        top: 34.5%; left: 74.5%; width: 23%;
    }

    /* R4 媒體區 */
    #R4_Container {
        position: absolute;
        top: 66.5%; left: 47.5%; width: 50.5%; height: 28%;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }

    /* D1 跑馬燈區 */
    #D1_Box {
        position: absolute;
        top: 92.5%; left: 2.2%; width: 95.6%;
        height: 5.5%;
        display: flex; align-items: center;
        color: white;
        font-size: 2vw;
    }
</style>
</head>
<body>

    <div id="L1_Container"><div id="L1_Content">載入中...</div></div>
    
    <div id="R2_Time">
        <div id="dateStr" class="date-str"></div>
        <div id="timeStr" class="time-str"></div>
    </div>

    <div id="R3_Weather">
        <a class="weatherwidget-io" href="https://forecast7.com/en/24d99121d30/taoyuan-city/" data-label_1="TAOYUAN CITY" data-theme="original" >TAOYUAN</a>
    </div>

    <div id="R4_Container"></div>

    <div id="D1_Box"><marquee id="tickerText" scrollamount="12"></marquee></div>

    <script>
        // --- 請在此替換您的三個 CSV 網址 ---
        const L1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2uPxWEdBPH7D6GCv7xhaxQtbcoSCzK4hTiXQdP2iV5d-NsZDEdmNVojTP5MQMyRlKWLOmP87kr5kr/pub?gid=0&single=true&output=csv";
        const R4_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2uPxWEdBPH7D6GCv7xhaxQtbcoSCzK4hTiXQdP2iV5d-NsZDEdmNVojTP5MQMyRlKWLOmP87kr5kr/pub?gid=1252696765&single=true&output=csv";
        const D1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2uPxWEdBPH7D6GCv7xhaxQtbcoSCzK4hTiXQdP2iV5d-NsZDEdmNVojTP5MQMyRlKWLOmP87kr5kr/pub?gid=1988370572&single=true&output=csv";

        // 更新時間
        function updateTime() {
            const now = new Date();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('dateStr').innerText = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${days[now.getDay()]}`;
            document.getElementById('timeStr').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
        }
        setInterval(updateTime, 1000);

        // 日期判斷邏輯
        function isCurrent(start, end) {
            const now = new Date();
            const s = new Date(start);
            const e = new Date(end);
            e.setHours(23, 59, 59); // 結束日包含當天
            return now >= s && now <= e;
        }

        // 讀取 L1 公告輪播
        async function initL1() {
            Papa.parse(L1_CSV, { download: true, header: true, complete: function(results) {
                const activeData = results.data.filter(d => d.顯示 === 'TRUE' && isCurrent(d.開始日, d.結束日));
                let idx = 0;
                function rotate() {
                    if (activeData.length === 0) return;
                    const item = activeData[idx];
                    let html = `<div class="L1_Title">${item.標題}</div>`;
                    if (item.類型 === 'image') html += `<img src="${item['內容圖片連結']}" class="L1_Image">`;
                    else html += `<div class="L1_Content">${item['內容圖片連結']}</div>`;
                    document.getElementById('L1_Container').innerHTML = html;
                    idx = (idx + 1) % activeData.length;
                }
                rotate();
                setInterval(rotate, 10000); // 10秒輪播
            }});
        }

        // 讀取 R4 媒體輪播
        async function initR4() {
            Papa.parse(R4_CSV, { download: true, header: true, complete: function(results) {
                const activeData = results.data.filter(d => d.顯示 === 'TRUE');
                let idx = 0;
                function rotate() {
                    if (activeData.length === 0) return;
                    const item = activeData[idx];
                    const container = document.getElementById('R4_Container');
                    if (item.類型 === 'video') {
                        container.innerHTML = `<video src="${item.連結}" autoplay muted class="media-item" id="vdo"></video>`;
                        document.getElementById('vdo').onended = rotate; // 影片播完自動下一則
                    } else {
                        container.innerHTML = `<img src="${item.連結}" class="media-item">`;
                        setTimeout(rotate, item.播放秒數 * 1000); // 依設定秒數輪播
                    }
                    idx = (idx + 1) % activeData.length;
                }
                rotate();
            }});
        }

        // 讀取 D1 跑馬燈
        async function initD1() {
            Papa.parse(D1_CSV, { download: true, header: true, complete: function(results) {
                const texts = results.data
                    .filter(d => d.顯示 === 'TRUE' && isCurrent(d.開始日, d.結束日))
                    .map(d => d.文字);
                document.getElementById('tickerText').innerText = texts.join(" ｜ ");
            }});
        }
// 天氣小工具載入
        !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
        
        // 每小時自動刷新頁面獲取最新內容
        setTimeout(() => { location.reload(); }, 3600000);
        
        initL1(); initR4(); initD1();
        !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
    </script>
</body>
</html>
